[project]
name = "gdocs-forensics"
version = "0.1.0"
description = "Reconstruct a Google Doc's full per-character, per-tab authorship from its internal revision history."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "browser-cookie3>=0.19",
    "matplotlib>=3.7",
]

[project.scripts]
gdocs-forensics = "gdocs_forensics.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gdocs_forensics"]
